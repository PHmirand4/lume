# Gera o APK de Release do Lume na nuvem (Linux), já que o Windows do
# desenvolvedor bloqueia o compilador AOT do Flutter (Controle Inteligente de Aplicativos).
#
# Quando roda:
#   - a cada push na branch main → APK disponível em "Artifacts" da execução
#   - ao criar uma tag v* (ex.: v1.0.1) → também publica uma Release com o APK
#   - manualmente, em Actions → "Build APK" → "Run workflow"
#
# Secrets necessários (Settings → Secrets and variables → Actions):
#   SUPABASE_URL, SUPABASE_KEY                     → servidor (chave pública)
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS → assinatura
name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # necessário para publicar Releases nas tags

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6 # mesma versão do SDK local
          cache: true

      - name: Dependências
        run: flutter pub get

      - name: Análise estática
        run: flutter analyze

      - name: Testes
        run: flutter test

      - name: Configuração do servidor
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::warning::SUPABASE_URL/SUPABASE_KEY ausentes — o APK vai rodar em modo local."
            echo '{}' > dart_defines.json
          else
            printf '{"SUPABASE_URL":"%s","SUPABASE_KEY":"%s"}' "$SUPABASE_URL" "$SUPABASE_KEY" > dart_defines.json
          fi

      - name: Chave de assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 ausente. Sem ele, cada APK teria uma assinatura diferente e não instalaria por cima do anterior."
            exit 1
          fi
          mkdir -p android/keystore
          echo "$KEYSTORE_BASE64" | base64 --decode > android/keystore/lume-release.jks
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=keystore/lume-release.jks"
          } > android/key.properties

      - name: Build do APK (Release)
        run: >
          flutter build apk --release
          --dart-define-from-file=dart_defines.json
          --build-number=${{ github.run_number }}

      - name: Nome do arquivo
        id: nome
        run: |
          VERSAO=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')
          NOME="lume-v${VERSAO}-build${{ github.run_number }}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$NOME"
          echo "arquivo=$NOME" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.nome.outputs.arquivo }}
          path: ${{ steps.nome.outputs.arquivo }}
          retention-days: 30

      - name: Publicar Release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.nome.outputs.arquivo }}
          generate_release_notes: true

      - name: Limpar segredos
        if: always()
        run: rm -f android/key.properties android/keystore/lume-release.jks dart_defines.json
